name: Build QMK Firmware
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install QMK Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pip git gcc-avr binutils-avr avr-libc gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi
        python3 -m pip install qmk

    - name: Force Build via Makefile
      # We bypass the 'qmk compile' check by running the lower-level compiler make syntax
      run: |
        make leopold/fc220tp:custom_rgb
        
    - name: Upload Finished Firmware
      uses: actions/upload-artifact@v4
      with:
        name: fc220tp_firmware
        path: .build/*.bin
