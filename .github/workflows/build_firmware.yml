name: Build QMK Firmware
on: [workflow_dispatch]

jobs:
  build:
    # Use the stable, pinned ubuntu-24.04 image to bypass the migration warnings
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout Repo
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install QMK Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pip git
        python3 -m pip install qmk

    - name: Compile Layout
      run: |
        qmk compile -kb leopold/fc220tp -km custom_rgb

    - name: Upload Finished Firmware
      # Upgraded to v4 to comply with current GitHub requirements
      uses: actions/upload-artifact@v4
      with:
        name: fc220tp_firmware
        path: .build/*.bin
